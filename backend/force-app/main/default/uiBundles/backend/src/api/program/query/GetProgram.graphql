query GetProgram($id: ID!) {
  uiapi {
    query {
      Program__c(where: { Id: { eq: $id } }, first: 1) {
        edges {
          node {
            Id
            Name @optional {
              value
            }
            Description__c @optional {
              value
            }
            DurationWeeks__c @optional {
              value
            }
            Status__c @optional {
              value
            }
          }
        }
      }
    }
  }
}
