query ListAssignableUsers($limit: Int) {
  uiapi {
    query {
      User(
        where: { IsActive: { eq: true } }
        orderBy: { Name: { order: ASC } }
        first: $limit
      ) {
        edges {
          node {
            Id
            Name @optional {
              value
            }
            Username @optional {
              value
            }
            UserType @optional {
              value
            }
          }
        }
      }
    }
  }
}
