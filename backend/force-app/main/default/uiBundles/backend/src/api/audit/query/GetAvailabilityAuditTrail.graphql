# Verlauf der eigenen Verfuegbarkeits-Slots.
#
# Verfuegbarkeits-Slots tragen bewusst kein ParticipantId__c (sie haengen an einem
# User, nicht an einem Teilnehmer), tauchen daher in keiner Teilnehmer-Timeline auf
# und sind ueber die bestehende Timeline-Query nicht abrufbar. Diese Query fragt
# stattdessen ueber ParentId__c = eigene User-ID.
#
# Der Domain__c-Filter ist im Query enthalten, nicht nur im Code: ein fehlender
# Filter hiesse, dass die Seite fremde Domains mitlaedt, nur weil der Explorer sie
# spaeter wegfiltert.
query GetAvailabilityAuditTrail(
  $userId: ID!
  $limit: Int
) {
  uiapi {
    query {
      AuditEvent__c(
        where: { and: [
          { ParentId__c: { eq: $userId } }
          { Domain__c: { eq: "availability" } }
        ] }
        orderBy: { OccurredAt__c: { order: DESC } }
        first: $limit
      ) {
        edges {
          node {
            Id
            OccurredAt__c {
              value
            }
            CreatedDate {
              value
            }
            EventType__c {
              value
            }
            SchemaVersion__c {
              value
            }
            Domain__c {
              value
            }
            Action__c {
              value
            }
            ActorType__c {
              value
            }
            ActorId__c {
              value
            }
            ActorDisplayName__c {
              value
            }
            SubjectType__c {
              value
            }
            SubjectId__c {
              value
            }
            ParticipantId__c {
              value
            }
            Source__c {
              value
            }
            CorrelationId__c {
              value
            }
            Reason__c {
              value
            }
            ChangedFields__c {
              value
            }
            Changes__c {
              value
            }
            Metadata__c {
              value
            }
            Visibility__c {
              value
            }
            Sensitivity__c {
              value
            }
          }
        }
      }
    }
  }
}
