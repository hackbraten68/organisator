mutation CreateAppointment(
  $participantId: IdOrRef!
  $coachId: IdOrRef
  $staffId: IdOrRef
  $type: Picklist!
  $status: Picklist
  $startTime: DateTime!
  $endTime: DateTime!
  $location: Picklist
  $meetingLink: String
  $notes: String
  $correlationId: String
) {
  uiapi {
    Appointment__cCreate(input: {
      Appointment__c: {
        Participant__c: $participantId
        Coach__c: $coachId
        Staff__c: $staffId
        Type__c: $type
        Status__c: $status
        StartTime__c: $startTime
        EndTime__c: $endTime
        Location__c: $location
        MeetingLink__c: $meetingLink
        Notes__c: $notes
        CorrelationId__c: $correlationId
      }
    }) {
      Record { Id }
    }
  }
}