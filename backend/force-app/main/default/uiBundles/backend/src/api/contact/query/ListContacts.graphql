query ListContacts {
  uiapi {
    query {
      # Freigeschaltet__c ist der bewusste Freischalt-Schritt: nur angehakte
      # Kontakte tauchen im Backend auf. Bewusst hart auf `eq: true` und nicht
      # ueber eine Variable — `eq: false` wuerde auf die *nicht* freigeschalteten
      # filtern und damit das Gegenteil liefern.
      Contact(
        first: 200
        orderBy: { LastName: { order: ASC } }
        where: { Freigeschaltet__c: { eq: true } }
      ) {
        edges {
          node {
            Id
            FirstName @optional {
              value
            }
            LastName @optional {
              value
            }
            Email @optional {
              value
            }
            Phone @optional {
              value
            }
            AccountId @optional {
              value
            }
            Freigeschaltet__c @optional {
              value
            }
            Account @optional {
              Name {
                value
              }
            }
          }
        }
      }
    }
  }
}
