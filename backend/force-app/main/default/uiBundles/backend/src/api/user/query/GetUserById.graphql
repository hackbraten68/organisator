query GetUserById($id: ID!) {
  uiapi {
    query {
      User(where: { Id: { eq: $id } }, first: 1) {
        edges {
          node {
            Id
            FirstName @optional {
              value
            }
            LastName @optional {
              value
            }
            Name @optional {
              value
            }
            Username @optional {
              value
            }
            SmallPhotoUrl @optional {
              value
            }
            Profile @optional {
              Id
              Name @optional {
                value
              }
            }
            UserRole @optional {
              Id
              Name @optional {
                value
              }
            }
          }
        }
      }
    }
  }
}
