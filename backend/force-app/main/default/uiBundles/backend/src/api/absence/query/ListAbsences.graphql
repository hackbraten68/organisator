query ListAbsences(
  $participantId: ID
  $status: Picklist
  $type: Picklist
  $startDateFrom: DateInput
  $startDateTo: DateInput
  $first: Int
  $after: String
) {
  uiapi {
    query {
      Absence__c(
        where: {
          and: [
            { Participant__c: { eq: $participantId } }
            { Status__c: { eq: $status } }
            { Type__c: { eq: $type } }
            { StartDate__c: { gte: $startDateFrom } }
            { StartDate__c: { lte: $startDateTo } }
          ]
        }
        first: $first
        after: $after
        orderBy: { StartDate__c: { order: DESC } }
      ) {
        edges {
          node {
            Id
            Name @optional {
              value
            }
            Participant__c @optional {
              value
            }
            Type__c @optional {
              value
            }
            Status__c @optional {
              value
            }
            StartDate__c @optional {
              value
            }
            EndDate__c @optional {
              value
            }
            Reason__c @optional {
              value
            }
            ApprovedBy__c @optional {
              value
            }
            ApprovedAt__c @optional {
              value
            }
            RejectedBy__c @optional {
              value
            }
            RejectedAt__c @optional {
              value
            }
            CoachComment__c @optional {
              value
            }
            CreatedDate @optional {
              value
            }
            LastModifiedDate @optional {
              value
            }
            Participant__r @optional {
              Name @optional {
                value
              }
            }
            ApprovedBy__r @optional {
              Name @optional {
                value
              }
            }
            RejectedBy__r @optional {
              Name @optional {
                value
              }
            }
          }
        }
        pageInfo {
          hasNextPage
          endCursor
        }
      }
    }
  }
}
