# Kein Status__c, kein ConfirmedAt__c, kein CompletedAt__c. Diese
# Mutation aendert Termindaten, nicht den fachlichen Zustand — dafuer
# gibt es je Status eine benannte Mutation, die Status und Zeitstempel
# atomar setzt.
mutation UpdateAppointment(
  $id: IdOrRef!
  $coachId: IdOrRef
  $type: Picklist
  $startTime: DateTime
  $endTime: DateTime
  $location: Picklist
  $meetingLink: Url
  $notes: LongTextArea
  $cancellationReason: LongTextArea
  $correlationId: String
) {
  uiapi {
    Appointment__cUpdate(input: {
      Id: $id
      Appointment__c: {
        Coach__c: $coachId
        Type__c: $type
        StartTime__c: $startTime
        EndTime__c: $endTime
        Location__c: $location
        MeetingLink__c: $meetingLink
        Notes__c: $notes
        CancellationReason__c: $cancellationReason
        CorrelationId__c: $correlationId
      }
    }) {
      Record { Id }
    }
  }
}