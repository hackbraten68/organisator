mutation CreateContentVersion(
  $title: String!
  $pathOnClient: String!
  $versionData: Base64!
  $firstPublishLocationId: IdOrRef!
) {
  uiapi {
    ContentVersionCreate(
      input: {
        ContentVersion: {
          Title: $title
          PathOnClient: $pathOnClient
          VersionData: $versionData
          FirstPublishLocationId: $firstPublishLocationId
        }
      }
    ) {
      Record {
        Id
      }
    }
  }
}
